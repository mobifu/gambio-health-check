[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file
    "F401",  # Unused import (z.B. Cython Import Check in build.py)
    "E501",  # Line too long
    "E722",  # Bare except
    "F841",  # Unused local variable
    "F811",  # Redefinition of unused import
]

[tool.ruff.lint.per-file-ignores]
"ui/main_window.py" = [
    "BLE001",  # Legacy Blind except in UI Event-Handlern und Background-Workern
    "S110",    # Legacy try-except-pass in Netzwerk-Workern
    "S112",    # Legacy try-except-continue
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ui.*"
ignore_errors = true
